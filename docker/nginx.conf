# video-dewatermark docker 版 nginx 站点配置（由 frontend/Dockerfile 覆盖到容器内）
#
# 与 ops/nginx/video-dewatermark.conf 逻辑一致：
#   1. 限流/限连接在进入 Python 之前挡掉刷量
#   2. 静态资源（前端 dist）在此容器内，/api 反代到 compose 的 backend 服务
#
# 注意：后端坐标是 compose 网络的服务名 backend（内部端口 3001），
#       静态根是 nginx 镜像内的 /usr/share/nginx/html（由构建产物覆盖）。

# ---- 限流 / 连接限制的共享内存区（http 上下文）----
limit_req_zone $binary_remote_addr zone=vd_parse:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=vd_conn:10m;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 解析接口：限频率（突发 30，超出直接 429）
    location = /api/parse {
        limit_req zone=vd_parse burst=30 nodelay;
        limit_req_status 429;
        limit_conn vd_conn 16;
        limit_conn_status 429;

        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 媒体 / 下载：只限并发连接数，不限频率
    location /api/ {
        limit_conn vd_conn 32;
        limit_conn_status 429;

        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 媒体/视频流式转发，不缓冲
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 50m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ---- PWA：Service Worker 与 manifest ----
    # sw.js 必须 no-cache：浏览器每次更新检查都要拿到最新版本，
    # 若被缓存住，发版后用户永远停留在旧 SW，缓存策略也无法更新。
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # manifest 同样不缓存，便于调整图标/名称后立即生效（体积很小，代价可忽略）
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # 带内容 hash 的构建产物：可长期强缓存（内容变了文件名就变）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}