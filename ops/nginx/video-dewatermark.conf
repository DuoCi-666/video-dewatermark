# video-dewatermark nginx 站点配置（部署到 /etc/nginx/conf.d/video-dewatermark.conf）
#
# 防护分两层：
#   1. nginx（本文件）：限流/限连接，在进入 Python 之前就挡掉刷量，最省资源
#   2. 应用层（backend/app/guard.py）：按 IP 的令牌桶 + 全局并发上限，可精细控制
# 职责划分：解析接口受限流保护；媒体/下载只限并发连接（视频流本身耗时长，
# 按频率限流会误伤正常播放）。

# ---- 限流 / 连接限制的共享内存区（http 上下文）----
limit_req_zone $binary_remote_addr zone=vd_parse:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=vd_conn:10m;

server {
    listen 8080;
    server_name _;

    root /opt/video-dewatermark/frontend/dist;
    index index.html;

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 解析接口：限频率（突发 30，超出直接 429）
    location = /api/parse {
        limit_req zone=vd_parse burst=30 nodelay;
        limit_req_status 429;
        limit_conn vd_conn 16;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 媒体 / 下载：只限并发连接数，不限频率
    location /api/ {
        limit_conn vd_conn 32;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 媒体/视频流式转发，不缓冲
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 50m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ---- PWA：Service Worker 与 manifest ----
    # sw.js 必须 no-cache：浏览器每次更新检查都要拿到最新版本，
    # 若被缓存住，发版后用户永远停留在旧 SW，缓存策略也无法更新。
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # manifest 同样不缓存，便于调整图标/名称后立即生效（体积很小，代价可忽略）
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # 带内容 hash 的构建产物：可长期强缓存（内容变了文件名就变）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
