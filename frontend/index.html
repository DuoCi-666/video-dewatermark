    <!--
      首屏主题预置：在 CSS/JS 加载前就把 class 落到 <html>，避免刷新时先白后黑闪一下（FOUC）。
      与 src/hooks/useTheme.ts 共用 'vd:theme' 键，取值 light / dark / system（默认 system）。
    -->
    <script>
      ;(function () {
        try {
          var pref = localStorage.getItem('vd:theme') || 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {
          /* 隐私模式：忽略，回落默认浅色 */
        }
      })()
    </script>
